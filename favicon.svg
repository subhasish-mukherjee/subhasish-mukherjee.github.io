<!-- Site favicon: an apple with a piece removed, and the piece floating above,
     waiting to be inserted. (The completion of a metric space.)
     Simplified to solid silhouettes so it stays legible at 16px.
     Regenerate the PNG with:
       rsvg-convert -w 180 -h 180 favicon.svg -o favicon.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- The missing piece: a blob built from overlapping circles. Drawn twice,
         once in the background color to punch the notch out of the apple, and
         once in apple red as the detached piece above. -->
    <g id="piece">
      <circle cx="6"    cy="6"   r="5.5"/>
      <circle cx="12"   cy="4.5" r="4.5"/>
      <circle cx="17"   cy="6.5" r="5"/>
      <circle cx="9"    cy="8.5" r="4.5"/>
      <circle cx="14.5" cy="8.5" r="4.5"/>
    </g>
  </defs>

  <rect width="64" height="64" rx="14" fill="#faf6ef"/>

  <!-- Apple body: circular through the sides and top, dipping into a dimple at
       the bottom center where the stem sits. The two short curves either side of
       "32,54.6" are the dimple; lowering that y makes it shallower. -->
  <path d="M50.5,41
           C50.5,50 45,57.2 38,58.6
           C35.4,59.1 33.8,57.6 32,54.6
           C30.2,57.6 28.6,59.1 26,58.6
           C19,57.2 13.5,50 13.5,41
           C13.5,31 21.5,23.5 32,23.5
           C42.5,23.5 50.5,31 50.5,41 Z" fill="#c53a2e"/>
  <path d="M32,55 L30.5,62.5" stroke="#6b4a2f" stroke-width="3" stroke-linecap="round"/>

  <!-- the notch, then the piece that fills it -->
  <use href="#piece" transform="translate(23.2,22.1) scale(0.8)" fill="#faf6ef"/>
  <use href="#piece" transform="translate(23.2,6.5) scale(0.8)" fill="#c53a2e"/>
</svg>
