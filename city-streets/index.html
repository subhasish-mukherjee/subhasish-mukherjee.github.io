<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Streets — cities</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <a class="home-link" href="../">&larr; Home</a>
  <h1>City Streets</h1>
  <nav><a href="./" class="active">Cities</a><a href="gallery.html">Gallery</a><a href="compare.html">Compare</a><a href="about.html">About</a></nav>
  <span class="muted" id="count"></span>
</header>
<main>
  <p class="muted">Street-network order, hilliness, and walkability across world cities.
     Click a column to sort (hover a header for its meaning — full definitions in
     <a href="about.html">About</a>); click a city for its measure on the sphere.</p>
  <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px">
    <input id="q" type="search" placeholder="search city…" style="background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 9px">
    <select id="region"><option value="">all regions</option></select>
    <select id="terrain"><option value="">all terrain</option></select>
  </div>
  <div style="overflow-x:auto"><table id="tbl"><thead></thead><tbody></tbody></table></div>
</main>
<script src="js/common.js"></script>
<script>
const COLS = [
  { k: "name", t: "City", tip: "Open the city page.", d: null, s: r => r.name,
    cell: r => `<a href="city.html?slug=${r.slug}">${r.name}</a>` },
  { k: "terrain", t: "Terrain", tip: "Registry category; not computed.", d: null, s: r => r.terrain,
    cell: r => `<span class="tag">${r.terrain}</span>` },
  { k: "core_area_km2", t: "core km²", tip: "Analyzed urban-core area, in km².", d: 0, s: r => r.core_area_km2 },
  { k: "extent", t: "Window", tip: "Input extent: municipal boundary or center-radius disc.", d: null, s: r => r.extent ?? "disc",
    cell: r => `<span class="tag">${r.extent ?? "disc"}</span>` },
  { k: "phi", t: "φ order", tip: "Grid order: 1 = one grid; 0 = uniform bearings.", d: 3, s: r => r.phi },
  { k: "entropy2d", t: "H₂D", tip: "Shannon entropy of the 36-bin bearing rose.", d: 3, s: r => r.entropy2d },
  { k: "spherical_entropy", t: "H sphere", tip: "Normalized entropy of bearing × grade; 1 = uniform.", d: 3, s: r => r.spherical_entropy },
  { k: "vertical_fraction", t: "vert %", tip: "Mean squared vertical component, length-weighted.", d: null, s: r => r.vertical_fraction, cell: r => pct(r.vertical_fraction, 2) },
  { k: "sphericity", t: "spher.", tip: "Orientation-tensor τ₃/τ₁; 1 = isotropic.", d: 3, s: r => r.sphericity },
  { k: "grid_angle", t: "grid θ°", tip: "Dominant grid rotation, from 0° to under 90°.", d: 1, s: r => r.grid_angle },
  { k: "hilliness", t: "hilly %", tip: "Mean absolute drive-network grade, length-weighted.", d: 2, s: r => r.hilliness },
  { k: "steep8", t: ">8% len", tip: "Share of graded drive-network length above 8% grade.", d: null, s: r => r.steep8, cell: r => pct(r.steep8, 1) },
  { k: "walk_hilliness", t: "walk hilly %", tip: "Mean absolute walk-network grade, including stairs.", d: 2, s: r => r.walk_hilliness },
  { k: "steps_per_km", t: "stairs/km", tip: "Connected staircases per km of walkable street.", d: 2, s: r => r.steps_per_km },
  { k: "walkscore", t: `<a href="https://www.walkscore.com/how-it-works/" target="_blank" rel="noopener">Walk Score®</a>`, tip: "Amenity-access score, averaged over sampled core points.", d: 0, s: r => r.walkscore,
    cell: r => r.walkscore == null ? "—" : `<a href="https://www.walkscore.com/how-it-works/" target="_blank" rel="noopener" title="How Walk Score works">${fmt(r.walkscore, 0)}</a>` },
  { k: "major_stairs", t: "major stairs", tip: "Connected staircases at least 30 m long.", d: 0, s: r => r.major_stairs },
  { k: "major_stairs_per_km_street", t: "major stairs/km", tip: "Major staircases per km of walkable street.", d: 3, s: r => r.major_stairs_per_km_street },
  { k: "circuity", t: "circuity", tip: "Street length divided by endpoint distance; 1 = straight.", d: 3, s: r => r.circuity },
  { k: "turn_rate", t: "turn °/100m", tip: "Direction change along roads, in degrees per 100 m.", d: 1, s: r => r.turn_rate },
  { k: "pop_density", t: "pop/km²", tip: "City-proper population divided by city land area.", d: 0, s: r => r.pop_density },
  { k: "signals_per_km2", t: "signals/km²", tip: "OSM traffic signals per km² of analyzed core.", d: 1, s: r => r.signals_per_km2 },
  { k: "four_way", t: "4-way %", tip: "Share of intersections incident to four streets.", d: null, s: r => r.four_way, cell: r => pct(r.four_way, 1) },
  { k: "park_share", t: "park %", tip: "OSM park area divided by analyzed core area.", d: null, s: r => r.park_share, cell: r => pct(r.park_share, 1) },
  { k: "park_km2", t: "park km²", tip: "OSM park area within the analyzed core.", d: 1, s: r => r.park_km2 },
];
let rows = [], renderTable = null;

function passes(r) {
  const q = document.getElementById("q").value.toLowerCase();
  const reg = document.getElementById("region").value;
  const ter = document.getElementById("terrain").value;
  return (!q || r.name.toLowerCase().includes(q)) &&
         (!reg || r.region === reg) && (!ter || r.terrain === ter);
}

function render() { renderTable && renderTable(); }

api("api/cities.json").then(d => {
  rows = d;
  for (const [id, key] of [["region", "region"], ["terrain", "terrain"]]) {
    const sel = document.getElementById(id);
    [...new Set(d.map(r => r[key]))].sort().forEach(v =>
      sel.insertAdjacentHTML("beforeend", `<option>${v}</option>`));
    sel.onchange = render;
  }
  document.getElementById("q").oninput = render;
  renderTable = sortableTable(document.getElementById("tbl"), COLS, rows, {
    sortKey: "hilliness", filter: passes,
    onRender: n => document.getElementById("count").textContent = `${n} / ${rows.length} cities`,
  });
}).catch(e => document.querySelector("main").innerHTML += `<p class="muted">No data yet: ${e.message}. Run the pipeline first.</p>`);
</script>
</body>
</html>
