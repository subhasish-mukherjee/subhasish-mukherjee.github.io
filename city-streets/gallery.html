<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Streets — gallery</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .roses { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .rose-card { text-align: center; padding: 10px 6px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; }
  .rose-card a { color: var(--fg); text-decoration: none; font-weight: 600; font-size: 13px; }
  .rose-card .sub { font-size: 11px; color: var(--muted); }
  .rose-card svg { width: 110px; height: 110px; }
</style>
</head>
<body>
<header>
  <a class="home-link" href="../">&larr; Home</a>
  <h1>City Streets</h1>
  <nav><a href="./">Cities</a><a href="gallery.html" class="active">Gallery</a><a href="compare.html">Compare</a><a href="about.html">About</a></nav>
  <label class="muted">region&nbsp;
    <select id="region"><option value="">all regions</option></select></label>
  <label class="muted">sort by&nbsp;
    <select id="sort">
      <option value="hilliness">hilliness</option>
      <option value="entropy2d">entropy</option>
      <option value="turn_rate">curviness</option>
      <option value="name">name</option>
    </select></label>
  <label class="muted">order&nbsp;
    <select id="direction">
      <option value="desc">descending</option>
      <option value="asc">ascending</option>
    </select></label>
</header>
<main>
  <p class="muted">Each city's bearing rose, replicating
    <a href="https://geoffboeing.com/2019/09/urban-street-network-orientation/">Geoff Boeing's work</a>.</p>
  <div class="roses" id="roses"></div>
</main>
<script src="js/common.js"></script>
<script>
let ROSES = [];
function render() {
  const k = document.getElementById("sort").value;
  const direction = document.getElementById("direction").value;
  const reg = document.getElementById("region").value;
  const shown = reg ? ROSES.filter(r => r.region === reg) : ROSES;
  const sorted = [...shown].sort((a, b) => {
    if (k === "name") {
      const comparison = a.name.localeCompare(b.name);
      return direction === "asc" ? comparison : -comparison;
    }
    const av = Number(a[k]), bv = Number(b[k]);
    const aMissing = a[k] == null || !Number.isFinite(av);
    const bMissing = b[k] == null || !Number.isFinite(bv);
    if (aMissing || bMissing) return aMissing === bMissing ? a.name.localeCompare(b.name) : (aMissing ? 1 : -1);
    const comparison = av - bv;
    return (direction === "asc" ? comparison : -comparison) || a.name.localeCompare(b.name);
  });
  document.getElementById("roses").innerHTML = sorted.map(r =>
    `<div class="rose-card"><a href="${cityHref(r.slug)}">${escapeHTML(r.name)}</a>
     ${roseSVG(r.proportions)}
     <div class="sub">φ ${fmt(r.phi, 2)} · hilly ${fmt(r.hilliness, 1)}%</div></div>`).join("");
}
document.getElementById("sort").onchange = render;
document.getElementById("direction").onchange = render;
api("api/roses.json").then(d => {
  ROSES = d;
  const sel = document.getElementById("region");
  [...new Set(d.map(r => r.region))].sort().forEach(r => addOption(sel, r));
  sel.onchange = render;
  render();
})
  .catch(e => showError(document.querySelector("main"), "Unable to load gallery: ", e));
</script>
</body>
</html>
