project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "projects/"
    - "papers/"
    - "!city-streets/"        # static export — passthrough only, never rendered by Quarto
  resources:
    - "city-streets/"         # copied verbatim into _site/city-streets/
    - "papers/pdfs/"
    - "images/"               # leatherwork / boots / food photos
    - "scripts/"

website:
  title: "Subhasish Mukherjee"
  site-url: "https://subhasishmukherjee.com"   # uncomment + set once the domain is purchased
  search: false
  favicon: favicon.png       # source is favicon.svg; regenerate with
                             #   rsvg-convert -w 180 -h 180 favicon.svg -o favicon.png
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: math.qmd
        text: Math
      - href: interests.qmd
        text: Other Interests & Projects
      - href: cv.qmd
        text: CV
  page-footer:
    center: "© 2026 Subhasish Mukherjee"

format:
  html:
    theme: [cosmo, styles.css]
    toc: false
    html-math-method: mathjax
